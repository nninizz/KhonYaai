version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: khonyaai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: khonyaai
      POSTGRES_USER: khonyaai
      POSTGRES_PASSWORD: khonyaai
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
